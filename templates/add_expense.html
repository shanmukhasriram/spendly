{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="form-card auth-card">
        <h2>Add New Expense</h2>
        <p class="form-subtitle">Keep track of your spending</p>

        <form method="POST" action="{{ url_for('add_expense') }}" class="auth-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="amount" class="form-input" placeholder="0.00" value="{{ amount or '' }}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category" class="form-input" required>
                    <option value="" disabled {% if not category %}selected{% endif %}>Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" name="description" id="description" class="form-input" placeholder="e.g. Grocery shopping" maxlength="200" value="{{ description or '' }}">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" name="date" id="date" class="form-input" value="{{ date or '' }}" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                <button type="submit" class="btn-primary">Save Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
