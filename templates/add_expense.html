{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="form-card auth-card">
        <h2>Add New Expense</h2>
        <p class="form-subtitle">Keep track of your spending</p>

        <form method="POST" action="{{ url_for('add_expense') }}" class="auth-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" step="0.01" name="amount" id="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" name="description" id="description" placeholder="e.g. Grocery shopping" required>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" name="date" id="date" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                <button type="submit" class="btn-primary">Save Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
